<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>structflo.cser — extract</title>
<script>
  // Match the suite's default before first paint. tokens.css defines light on
  // :root and dark on [data-theme="dark"].
  document.documentElement.dataset.theme =
    matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-size: 14px; }

/* ── Header ── */
header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
         gap: 12px; flex-wrap: wrap; padding: 10px 18px;
         background: var(--ds-surface-elevated); border-bottom: 1px solid var(--ds-border);
         box-shadow: var(--ds-shadow-sm); }
h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
h1 span { color: var(--ds-accent-text); }
.hint { font-size: 12px; color: var(--ds-text-muted); }
#status { margin-left: auto; font-size: 12px; color: var(--ds-text-secondary);
          font-variant-numeric: tabular-nums; }

button { font-family: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px;
         border-radius: var(--radius-md); cursor: pointer; border: 1px solid var(--ds-border);
         background: var(--ds-surface); color: var(--ds-text-secondary);
         transition: background .12s, border-color .12s; }
button:hover { background: var(--ds-surface-hover); }
button.primary { background: var(--ds-accent); border-color: var(--ds-accent);
                 color: var(--ds-text-inverse); }
button.primary:hover { background: var(--ds-accent-hover); border-color: var(--ds-accent-hover); }
button:disabled { opacity: .45; pointer-events: none; }

input[type=file] { font-family: inherit; font-size: 12px; color: var(--ds-text-secondary);
                   max-width: 300px; }
input[type=file]::file-selector-button {
  font-family: inherit; font-size: 13px; font-weight: 500; margin-right: 10px;
  padding: 6px 12px; border-radius: var(--radius-md); cursor: pointer;
  border: 1px solid var(--ds-border); background: var(--ds-surface);
  color: var(--ds-text-secondary); }
input[type=file]::file-selector-button:hover { background: var(--ds-surface-hover); }

/* ── Progress ── */
#progress { display: none; margin: 18px; padding: 16px 18px; gap: 14px;
            align-items: center; background: var(--ds-surface-elevated);
            border: 1px solid var(--ds-border); border-radius: var(--radius-lg);
            box-shadow: var(--ds-shadow-sm); }
#progress.on { display: flex; }
.spinner { width: 18px; height: 18px; flex-shrink: 0; border-radius: 50%;
           border: 2px solid var(--ds-accent-muted); border-top-color: var(--ds-accent);
           animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#prog-main { font-size: 13px; font-weight: 500; }
#prog-sub  { font-size: 12px; color: var(--ds-text-muted); margin-top: 3px; }
#elapsed { margin-left: auto; font-size: 12px; color: var(--ds-text-muted);
           font-variant-numeric: tabular-nums; }

/* ── Page section ── */
.page-head { font-size: 11px; font-weight: 600; color: var(--ds-text-muted);
             padding: 18px 18px 0; letter-spacing: .06em; text-transform: uppercase; }
.page { display: flex; gap: 18px; padding: 12px 18px 20px; align-items: flex-start; }

/* border on .canvas so the SVG overlay (inset:0) lines up with the image */
.canvas { flex: 0 0 44%; align-self: flex-start; position: sticky; top: 60px;
          border: 1px solid var(--ds-border); border-radius: var(--radius-lg);
          overflow: hidden; box-shadow: var(--ds-shadow-sm); background: #fff; }
.canvas img { width: 100%; display: block; }
.canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.canvas-inner { position: relative; }
.pair { cursor: pointer; opacity: .85; }
.pair.hot { opacity: 1; }
.pair .sbox { fill: none; stroke: var(--ds-feature-compounds); }
.pair .lbox { fill: none; stroke: var(--ds-accent); }
.pair .link { stroke: var(--ds-score-fair); }
.pair .head { fill: var(--ds-score-fair); }
.pair.hot .sbox, .pair.hot .lbox, .pair.hot .link { stroke-width: var(--hot); }

/* ── Result cards ── */
.cards { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { border: 1px solid var(--ds-border); border-radius: var(--radius-lg);
        background: var(--ds-surface-elevated); padding: 12px 14px;
        box-shadow: var(--ds-shadow-sm); transition: border-color .12s, background .12s; }
.card.hot { border-color: var(--ds-accent); background: var(--ds-accent-subtle); }
.chain { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.chain + .chain { margin-top: 10px; border-top: 1px solid var(--ds-border-subtle);
                  padding-top: 10px; }
.arrow { color: var(--ds-score-fair); font-size: 16px; user-select: none; }
.crop { background: #fff; border: 1px solid var(--ds-border);
        border-radius: var(--radius-sm); display: block; }
.crop.lbl { max-height: 34px; }
.crop.str { max-height: 108px; }
.crop.mol { max-height: 108px; }
.tag { font-size: 10px; font-weight: 600; color: var(--ds-text-muted);
       letter-spacing: .06em; text-transform: uppercase; width: 62px; flex-shrink: 0; }
.id { font-family: var(--font-mono); font-size: 15px; font-weight: 500;
      color: var(--ds-accent-text); word-break: break-all; }
.smiles { flex: 1; min-width: 180px; font-family: var(--font-mono); font-size: 12px;
          line-height: 1.5; word-break: break-all; color: var(--ds-text-primary); }
.bad { color: var(--ds-error); }
.conf { margin-left: auto; align-self: flex-start; font-size: 11px;
        color: var(--ds-text-muted); font-variant-numeric: tabular-nums; }
.empty, .err { margin: 4px 0; font-size: 13px; color: var(--ds-text-muted); }
.err { color: var(--ds-error); padding: 18px; white-space: pre-wrap; }
</style>
</head>
<body>

<header>
  <h1>structflo<span>.cser</span></h1>
  <input type="file" id="file" accept=".pdf,image/*">
  <button id="go" class="primary">Extract</button>
  <button id="xlsx" disabled>Download Excel</button>
  <span class="hint">structure &rarr; label pairing shown on the page; PDFs stream page by page</span>
  <span id="status"></span>
</header>

<div id="progress">
  <div class="spinner"></div>
  <div>
    <div id="prog-main">Starting…</div>
    <div id="prog-sub"></div>
  </div>
  <div id="elapsed">0:00</div>
</div>

<div id="out"></div>

<script>
const $ = s => document.querySelector(s);
const out = $('#out'), status = $('#status');
let rows = [];   // {page, id, smiles, confidence} — also the Excel export payload

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mid = b => [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];

/* ── Progress panel ── */
let tick = null, t0 = 0;
function progress(main, sub) {
  $('#progress').classList.add('on');
  $('#prog-main').textContent = main;
  $('#prog-sub').textContent = sub || '';
  if (tick) return;
  t0 = performance.now();
  const paint = () => {
    const s = Math.floor((performance.now() - t0) / 1000);
    $('#elapsed').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  paint();
  tick = setInterval(paint, 1000);
}
function progressDone() {
  clearInterval(tick); tick = null;
  $('#progress').classList.remove('on');
}

function hot(key, on) {
  document.querySelectorAll(`[data-k="${key}"]`).forEach(e => e.classList.toggle('hot', on));
}

function copy(text) {
  navigator.clipboard?.writeText(text).catch(fallback) ?? fallback();
  function fallback() {   // clipboard API needs a secure context; plain-http hosts lack one
    const t = document.createElement('textarea');
    t.value = text; document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove();
  }
}

function renderPage(p) {
  const sw = Math.max(2, p.w / 500), head = document.createElement('div');
  head.className = 'page-head';
  head.textContent = `Page ${p.index + 1} — ${p.pairs.length} pair(s)`;
  out.appendChild(head);

  const boxes = p.pairs.map(q => {
    const k = `p${p.index}-${q.i}`, [sx, sy] = mid(q.structure_bbox), [lx, ly] = mid(q.label_bbox);
    const r = b => `x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}"`;
    return `<g class="pair" data-k="${k}" style="--hot:${sw * 2.2}px" stroke-width="${sw}">
      <line class="link" x1="${sx}" y1="${sy}" x2="${lx}" y2="${ly}" marker-end="url(#a${p.index})"/>
      <rect class="sbox" ${r(q.structure_bbox)}/>
      <rect class="lbox" ${r(q.label_bbox)}/>
    </g>`;
  }).join('');

  const cards = p.pairs.map(q => {
    const k = `p${p.index}-${q.i}`;
    const conf = q.match_confidence == null ? '' : `match ${(q.match_confidence * 100).toFixed(0)}%`;
    const mol = q.smiles_img
      ? `<span class="arrow">&rarr;</span><img class="crop mol" src="${q.smiles_img}" title="re-drawn from the extracted SMILES">`
      : '';
    const smi = q.smiles
      ? `<span class="smiles${q.smiles_img ? '' : ' bad'}">${esc(q.smiles)}${q.smiles_img ? '' : '  (rdkit could not parse)'}</span>
         <button data-copy="${esc(q.smiles)}">Copy</button>`
      : `<span class="smiles bad">no SMILES</span>`;
    return `<div class="card" data-k="${k}">
      <div class="chain">
        <span class="tag">Label</span>
        <img class="crop lbl" src="${q.label_crop}">
        <span class="arrow">&rarr;</span>
        <span class="id">${esc(q.id) || '<span class="bad">no OCR text</span>'}</span>
        <span class="conf">${conf}</span>
      </div>
      <div class="chain">
        <span class="tag">Structure</span>
        <img class="crop str" src="${q.structure_crop}">
        ${mol}
        <span class="arrow">&rarr;</span>
        ${smi}
      </div>
    </div>`;
  }).join('') || '<div class="empty">No structure/label pairs found on this page.</div>';

  const sec = document.createElement('div');
  sec.className = 'page';
  sec.innerHTML = `
    <div class="canvas"><div class="canvas-inner">
      <img src="${p.image}">
      <svg viewBox="0 0 ${p.w} ${p.h}" preserveAspectRatio="none">
        <defs><marker id="a${p.index}" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto">
          <path class="head" d="M0,0 L4,2 L0,4 z"/>
        </marker></defs>
        ${boxes}
      </svg>
    </div></div>
    <div class="cards">${cards}</div>`;
  out.appendChild(sec);

  sec.querySelectorAll('[data-k]').forEach(el => {
    el.onmouseenter = () => hot(el.dataset.k, true);
    el.onmouseleave = () => hot(el.dataset.k, false);
  });
  sec.querySelectorAll('.pair').forEach(g => {
    g.onclick = () => sec.querySelector(`.card[data-k="${g.dataset.k}"]`)
      ?.scrollIntoView({block: 'center', behavior: 'smooth'});
  });
  sec.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = () => { copy(b.dataset.copy); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 900); };
  });

  p.pairs.forEach(q => rows.push({
    page: p.index + 1, id: q.id, smiles: q.smiles, confidence: q.match_confidence,
  }));
  $('#xlsx').disabled = !rows.length;
}

$('#go').onclick = async () => {
  const f = $('#file').files[0];
  if (!f) return status.textContent = 'Pick a file first';
  out.innerHTML = ''; rows = []; $('#xlsx').disabled = true; $('#go').disabled = true;
  status.textContent = '';
  progress('Uploading…', f.name);

  try {
    const fd = new FormData(); fd.append('file', f);
    const res = await fetch('/extract', {method: 'POST', body: fd});
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    progress('Loading models…', 'first run only, about 30 seconds');

    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', total = 0, done_pages = 0, pairs = 0;
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines.filter(l => l.trim())) {
        const msg = JSON.parse(line);
        if (msg.error) throw new Error(msg.error);
        if (msg.n_pages) {
          total = msg.n_pages;
          progress(`Extracting page 1 of ${total}…`, 'detecting structures, then reading SMILES');
          continue;
        }
        renderPage(msg);
        done_pages++; pairs += msg.pairs.length;
        status.textContent = `${done_pages}/${total} pages · ${pairs} pairs`;
        if (done_pages < total)
          progress(`Extracting page ${done_pages + 1} of ${total}…`, `${pairs} pairs so far`);
      }
    }
    progressDone();
    status.textContent = `Done — ${done_pages} page(s), ${pairs} pair(s)`;
  } catch (e) {
    progressDone();
    out.insertAdjacentHTML('beforeend', `<div class="err">${esc(e.message)}</div>`);
    status.textContent = 'Failed';
  }
  $('#go').disabled = false;
};

$('#xlsx').onclick = async () => {
  const res = await fetch('/export.xlsx', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({rows, name: $('#file').files[0]?.name || 'extract'}),
  });
  if (!res.ok) return status.textContent = 'Export failed';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = (($('#file').files[0]?.name || 'extract').replace(/\.[^.]+$/, '')) + '.xlsx';
  a.click(); URL.revokeObjectURL(a.href);
};

$('#file').onchange = () => { status.textContent = ''; };
</script>
</body>
</html>
