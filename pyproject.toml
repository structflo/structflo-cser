[project]
name = "structflo-cser"
dynamic = ["version"]
description = "Chemical structure-label pair extraction from scientific documents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "decimer>=2.8.0",
    "flask>=3.1.3",
    "matplotlib>=3.10.8",
    "easyocr>=1.7",
    "numpy>=2.4.2",
    "openpyxl>=3.1",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.1.1",
    "pypdfium2>=5",
    "pyyaml>=6.0",
    "rdkit>=2025.9.5",
    "huggingface_hub>=0.24.0",
    "packaging>=23.0",
    "requests>=2.31.0",
    "scipy>=1.17.0",
    "pandas>=2.0.0",
    "tqdm>=4.67.3",
    "safetensors>=0.4",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.52.1",
]

[project.scripts]
sf-fetch-smiles         = "structflo.cser.data.smiles:main"
sf-generate             = "structflo.cser.generation.dataset:main"
sf-train                = "structflo.cser.training.trainer:main"
sf-detect               = "structflo.cser.inference.detector:main"
sf-viz                  = "structflo.cser.viz.labels:main"
sf-download-distractors = "structflo.cser.data.distractor_images:main"
sf-annotate             = "annotate.__main__:main"
sf-extract              = "structflo.cser.pipeline.cli:main"
sf-train-lps            = "structflo.cser.lps.train:main"
sf-eval-lps             = "structflo.cser.lps.evaluate:main"
sf-train-relmatch       = "structflo.cser.relmatch.train:main"
sf-web                  = "webapp.server:main"

[build-system]
requires = ["hatchling<1.28", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["structflo", "annotate", "webapp"]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.4",
    "pycocotools>=2.0.8",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
]
